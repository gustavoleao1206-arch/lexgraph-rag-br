# Local stack: Qdrant, a one-shot indexing job, the API and the Streamlit UI.
#
#   cp .env.example .env                                  # then fill in the provider keys
#   docker compose up --build                             # index every law (minutes on CPU)
#   INGEST_ARGS="--law LGPD" docker compose up --build    # quick start: index a single law
#   docker compose run --rm ingest lexgraph ingest        # rebuild the index regardless
#
# The index lives in the qdrant-storage volume: a later start keeps it while it holds the
# same chunks (corpus and laws) embedded by the same models, and rebuilds it otherwise. The
# image bakes in the models that .env selects, so rebuild it (--build) after changing them.
#
# UI: http://localhost:8501   API docs: http://localhost:8000/docs
# Qdrant dashboard: http://localhost:6333/dashboard
# Ports are published on localhost only. The API has no key unless LEXGRAPH_API_KEY is set;
# Qdrant has none either, and sends no CORS headers, so pages of other sites cannot read it.

name: lexgraph

x-lexgraph: &lexgraph
  image: lexgraph:local
  build:
    context: .
    # The image holds the models these settings select; arguments without a value come
    # from the environment or .env, and the unset ones keep the defaults of the settings.
    args:
      LEXGRAPH_EMBEDDING_PROVIDER:
      LEXGRAPH_EMBEDDING_MODEL:
      LEXGRAPH_SPARSE_MODEL:
      LEXGRAPH_RERANKER_MODEL:
      INCLUDE_RERANKER: ${INCLUDE_RERANKER:-${LEXGRAPH_RERANK:-false}}
    # HF_TOKEN, when set, authenticates the model downloads.
    secrets:
      - hf_token
  init: true
  env_file:
    - path: .env
      required: false

services:
  qdrant:
    image: qdrant/qdrant:v1.20.0@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
      # No CORS headers: pages of other sites cannot read its responses or send it preflighted
      # requests (JSON bodies, DELETE). The dashboard is same-origin, so it still works.
      QDRANT__SERVICE__ENABLE_CORS: "false"
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-storage:/qdrant/storage
    healthcheck:
      # The image ships bash but neither curl nor wget.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333 &&
          printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

  # Indexes data/corpus into Qdrant and exits; an index that is already up to date is kept.
  ingest:
    <<: *lexgraph
    command: lexgraph ingest --if-missing ${INGEST_ARGS:-}
    environment:
      LEXGRAPH_QDRANT_URL: http://qdrant:6333
    healthcheck:
      disable: true
    depends_on:
      qdrant:
        condition: service_healthy

  # Health comes from the image's HEALTHCHECK (GET /health).
  api:
    <<: *lexgraph
    command: ["lexgraph", "serve", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      LEXGRAPH_QDRANT_URL: http://qdrant:6333
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - checkpoints:/app/data/checkpoints
    depends_on:
      qdrant:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully

  # Calls the API at http://api:8000; "api" is among the default LEXGRAPH_ALLOWED_HOSTS.
  ui:
    <<: *lexgraph
    command: ["lexgraph", "ui", "--host", "0.0.0.0", "--port", "8501"]
    environment:
      LEXGRAPH_API_URL: http://api:8000
    ports:
      - "127.0.0.1:8501:8501"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=4)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    depends_on:
      api:
        condition: service_healthy

secrets:
  hf_token:
    environment: HF_TOKEN

volumes:
  qdrant-storage:
  checkpoints:
