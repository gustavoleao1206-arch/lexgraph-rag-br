[project]
name = "lexgraph"
version = "0.1.0"
description = "Agentic RAG over Brazilian federal legislation: LangGraph corrective loop, hybrid search on Qdrant and answers with article-level citations."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gustavo Leão" }]
requires-python = ">=3.12"
keywords = ["rag", "langgraph", "langchain", "qdrant", "hybrid-search", "bm25", "legal", "brazil", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
dependencies = [
    "beautifulsoup4>=4.15",
    "fastapi>=0.162",
    "fastembed>=0.9.1",
    "google-genai>=2.34,<3",
    "httpx>=0.28",
    "langchain>=1.4",
    "langchain-core>=1.7",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "lxml>=6.1",
    "py-rust-stemmers>=0.1.8",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "python-dotenv>=1.1",
    "qdrant-client>=1.20",
    "rich>=14.0",
    "tenacity>=9.1",
    "typer>=0.27",
    "uvicorn>=0.54",
]

[project.optional-dependencies]
ui = ["streamlit>=1.66"]
openai = ["langchain-openai>=1.7"]

[project.scripts]
lexgraph = "lexgraph.cli:app"

[project.urls]
Homepage = "https://github.com/gustavoleao1206-arch/lexgraph-rag-br"
Repository = "https://github.com/gustavoleao1206-arch/lexgraph-rag-br"
Issues = "https://github.com/gustavoleao1206-arch/lexgraph-rag-br/issues"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1",
    "mypy>=2.4.1",
    "numpy>=2.0",
    "pre-commit>=4.7",
    "pytest>=9.2",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1",
    "ruff>=0.17.3",
]

[tool.uv]
required-version = ">=0.13.6"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["E", "W", "N", "UP", "B", "S", "PT", "TC", "PTH", "RET", "SIM", "C4", "PERF", "ASYNC", "FAST", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pydantic_settings.BaseSettings"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "scripts"]
strict = true
warn_unreachable = true
enable_error_code = ["deprecated", "ignore-without-code", "redundant-expr", "truthy-bool"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
# Tests that download models or call LLM providers run only on request: a later -m replaces
# this one (`pytest -m integration`, `pytest -m llm`, or `pytest -m ""` for every test).
addopts = ["-ra", "-m", "not integration and not llm"]
strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
markers = [
    "integration: needs downloaded embedding models or a running Qdrant server",
    "llm: calls a real LLM provider (needs GROQ_API_KEY or GOOGLE_API_KEY)",
]

[tool.coverage.run]
source = ["lexgraph"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
